name: WinGet Submit

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to submit, e.g. 1.4.0 (must match an existing vX.Y.Z release tag with an MSI asset)"
        required: true
        type: string

jobs:
  winget:
    name: Submit WinGet manifest update
    runs-on: windows-latest
    if: "github.event_name == 'workflow_dispatch' || !github.event.release.prerelease"
    steps:
      - name: Determine version, installer URL, and release notes
        id: vars
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $tag = "v$version"
          } else {
            $tag = "${{ github.event.release.tag_name }}"
            $version = $tag -replace '^v', ''
          }
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/Envarly_${version}_x64_en-US.msi"

          # winget-pkgs flags a version update as inconsistent if ReleaseNotes
          # was present on the last submitted version and is missing on this
          # one, so always pull the real release body rather than relying on
          # wingetcreate to carry anything forward on its own.
          $releaseNotes = gh release view $tag --repo ${{ github.repository }} --json body -q .body
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            $releaseNotes = "See $tag on GitHub Releases for details."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "url=$url" >> $env:GITHUB_OUTPUT

          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          "releaseNotes<<$delimiter" >> $env:GITHUB_OUTPUT
          $releaseNotes >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Install wingetcreate
        shell: pwsh
        run: Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Generate manifest locally
        shell: pwsh
        run: |
          # `update` has no flag for setting the ReleaseNotes *text* (only
          # --release-notes-url, which it already auto-fills from --token).
          # Generate locally first so the next step can patch that field in
          # before handing off to `submit`.
          .\wingetcreate.exe update Envarly.Envarly `
            --version ${{ steps.vars.outputs.version }} `
            --urls "${{ steps.vars.outputs.url }}" `
            --token ${{ secrets.WINGET_TOKEN }} `
            --out ./wingetcreate-out

      - name: Patch ReleaseNotes into the generated manifest
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ steps.vars.outputs.releaseNotes }}
        run: |
          $localeFile = Get-ChildItem -Path ./wingetcreate-out -Recurse -Filter "Envarly.Envarly.locale.en-US.yaml" |
            Select-Object -First 1
          if (-not $localeFile) {
            throw "wingetcreate did not produce a locale manifest under ./wingetcreate-out"
          }

          $noteLines = @("ReleaseNotes: |-")
          $noteLines += ($env:RELEASE_NOTES -replace "`r`n", "`n") -split "`n" | ForEach-Object { "  $_" }

          $patched = foreach ($line in Get-Content $localeFile.FullName) {
            if ($line -match '^ManifestType:') { $noteLines }
            $line
          }
          Set-Content -Path $localeFile.FullName -Value $patched

          "manifestDir=$($localeFile.DirectoryName)" >> $env:GITHUB_OUTPUT
        id: patch

      - name: Submit the patched manifest
        shell: pwsh
        run: |
          .\wingetcreate.exe submit `
            --prtitle "Update version: Envarly.Envarly version ${{ steps.vars.outputs.version }}" `
            --token ${{ secrets.WINGET_TOKEN }} `
            "${{ steps.patch.outputs.manifestDir }}"
